[build-system]
requires = ["setuptools>=61.0", "versioningit~=2.0"]
build-backend = "setuptools.build_meta"

# Self-descriptive entries which should always be present
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
[project]
name = "pyGSM"
description = "Reaction path and photochemistry tool"
dynamic = ["version"]
readme = "README.md"
authors = [
    { name = "Cody Aldaz", email = "codyaldaz@gmail.com" }
]
license = { text = "MIT" }
# See https://pypi.org/classifiers/
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.8"
# Declare any run-time dependencies that should be installed with the package.
dependencies = [
    "importlib-resources;python_version<'3.10'",
    "numpy>1.11",
    "six",
    "scipy",
    "matplotlib",
    "networkx",
    "pytest-cov",
    "sphinx",
    "sphinx_rtd_theme",
    "typing-extensions",
]

# Update the urls once the hosting is set up.
#[project.urls]
#"Source" = "https://github.com/<username>/pyGSM/"
#"Documentation" = "https://pyGSM.readthedocs.io/"

[project.optional-dependencies]
test = [
  "pytest>=6.1.2",
  "pytest-runner"
]
# Semiempirical GFN-xTB backend. tblite is the maintained successor to
# xtb-python, which has had no release since 2022 and ships no wheels beyond
# Python 3.11; "xtb" is kept as a separate extra for existing users.
tblite = [
  "tblite",
]
xtb = [
  "xtb",
]

[tool.setuptools]
# This subkey is a beta stage development and keys may change in the future, see https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html for more details
#
# As of version 0.971, mypy does not support type checking of installed zipped
# packages (because it does not actually import the Python packages).
# We declare the package not-zip-safe so that our type hints are also available
# when checking client code that uses our (installed) package.
# Ref:
# https://mypy.readthedocs.io/en/stable/installed_packages.html?highlight=zip#using-installed-packages-with-mypy-pep-561
zip-safe = false
# Let setuptools discover the package in the current directory,
# but be explicit about non-Python files.
# See also:
#   https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html#setuptools-specific-configuration
# Note that behavior is currently evolving with respect to how to interpret the
# "data" and "tests" subdirectories. As of setuptools 63, both are automatically
# included if namespaces is true (default), even if the package is named explicitly
# (instead of using 'find'). With 'find', the 'tests' subpackage is discovered
# recursively because of its __init__.py file, but the data subdirectory is excluded
# with include-package-data = false and namespaces = false.
include-package-data = false
[tool.setuptools.packages.find]
namespaces = false
where = ["."]

# Ref https://setuptools.pypa.io/en/latest/userguide/datafiles.html#package-data
[tool.setuptools.package-data]
pyGSM = [
    "py.typed"
]

[tool.versioningit]
default-version = "1+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
# The method key:
method = "git"  # <- The method name
# Parameters to pass to the method:
match = ["*"]
default-tag = "1.0.0"

[tool.versioningit.write]
file = "pyGSM/_version.py"

[tool.ruff.format]
quote-style = "single"

# pixi configuration lives here rather than in a separate pixi.toml so that
# plain "pip install -e ." keeps working for anyone not using pixi.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.14"
numpy = ">1.11"
scipy = "*"
matplotlib-base = "*"
networkx = "*"
six = "*"
typing-extensions = "*"
# conda-forge calls the tblite python bindings "tblite-python"; on PyPI the
# same bindings are published as "tblite"
tblite-python = "*"

[tool.pixi.pypi-dependencies]
pyGSM = { path = ".", editable = true }

[tool.pixi.feature.notebook.dependencies]
jupyterlab = "*"
ipykernel = "*"
py3dmol = "*"
ase = "*"

[tool.pixi.feature.test.dependencies]
pytest = ">=6.1.2"
pytest-cov = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
notebook = { features = ["notebook"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest -v pyGSM/tests/"
