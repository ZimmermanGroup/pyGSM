name: CI

on:
  # The cookiecutter uses the "--initial-branch" flag when it runs git-init
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"
  schedule:
    # Weekly tests run on master by default:
    #   Scheduled workflows run on the latest commit on the default or base branch.
    #   (from https://help.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule)
    - cron: "0 0 * * 0"

jobs:
  test:
    name: Test on ubuntu-latest, Python ${{ matrix.python-version }}, ${{ matrix.numpy }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # numpy<2 runs the smoke tests with ndim>0 -> scalar DeprecationWarnings as errors,
          # numpy>=2.4 is where those conversions are TypeErrors.
          - {python-version: "3.10", numpy: "numpy<2"}
          - {python-version: "3.12", numpy: "numpy<2"}
          - {python-version: "3.12", numpy: "numpy>=2.4"}
          - {python-version: "3.13", numpy: "numpy>=2.4"}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: |
          uv pip install --system pytest pytest-cov ase "${{ matrix.numpy }}" scipy networkx six matplotlib
          uv pip install --system --no-deps -e .
          # optional: xtb-python (MECP test); the test is skipped without it
          uv pip install --system --no-deps xtb || echo "xtb-python unavailable, MECP test will be skipped"

      - name: Run tests
        # conda setup requires this special shell
        shell: bash -l {0}
        run: |
          pytest -v --cov=pyGSM --cov-report=xml --color=yes pyGSM/tests/

      - name: CodeCov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-ubuntu-py${{ matrix.python-version }}-${{ matrix.numpy }}
